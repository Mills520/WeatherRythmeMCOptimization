buildscript {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.6.12'
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'maven-publish'

version = project.findProperty('mod_version') ?: '1.0.0'
base {
    archivesName = "weatherrythme-fabric-${project.findProperty('minecraft_version') ?: '1.21.1'}"
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

def mcVersion = project.findProperty('minecraft_version') ?: '1.21.1'
def yarnVersion = project.findProperty('yarn_mappings') ?: "${mcVersion}+build.1"
def loaderVersion = project.findProperty('fabric_loader_version') ?: '0.16.10'
def fabricApiVersion = project.findProperty('fabric_api_version') ?: '0.115.1+1.21.1'

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings "net.fabricmc:yarn:${yarnVersion}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
