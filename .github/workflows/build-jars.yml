name: build-jars

on:
  workflow_dispatch:
  push:
    branches: ["main", "master", "work"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.17.1"
            fabric_api: "0.46.1+1.17"
            fabric_loader: "0.14.25"
            forge: "37.1.1"
          - mc: "1.18.2"
            fabric_api: "0.77.0+1.18.2"
            fabric_loader: "0.15.11"
            forge: "40.2.21"
          - mc: "1.19.2"
            fabric_api: "0.77.0+1.19.2"
            fabric_loader: "0.15.11"
            forge: "43.4.2"
          - mc: "1.20.1"
            fabric_api: "0.92.2+1.20.1"
            fabric_loader: "0.16.10"
            forge: "47.3.0"
          - mc: "1.21.1"
            fabric_api: "0.115.1+1.21.1"
            fabric_loader: "0.16.10"
            forge: "52.0.30"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric (${{ matrix.mc }})
        run: |
          gradle -p fabric clean build \
            -Pminecraft_version=${{ matrix.mc }} \
            -Pyarn_mappings=${{ matrix.mc }}+build.1 \
            -Pfabric_loader_version=${{ matrix.fabric_loader }} \
            -Pfabric_api_version=${{ matrix.fabric_api }}

      - name: Build Forge (${{ matrix.mc }})
        run: |
          gradle -p forge clean build \
            -Pminecraft_version=${{ matrix.mc }} \
            -Pforge_version=${{ matrix.forge }}

      - name: Stage artifacts
        run: |
          mkdir -p dist/fabric/${{ matrix.mc }} dist/forge/${{ matrix.mc }}
          cp fabric/build/libs/*.jar dist/fabric/${{ matrix.mc }}/ || true
          cp forge/build/libs/*.jar dist/forge/${{ matrix.mc }}/ || true

      - name: Upload artifacts (${{ matrix.mc }})
        uses: actions/upload-artifact@v4
        with:
          name: weatherrythme-${{ matrix.mc }}
          path: dist/
          if-no-files-found: error
